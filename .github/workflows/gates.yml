# .github/workflows/gates.yml
name: Gates

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No network calls to Figma in agent code
        run: |
          ! grep -rn "api\.figma\.com" --include="*.ts" --include="*.tsx" \
              --include="*.js" apps packages || \
            (echo "Figma API referenced outside ops/ — quota risk" && exit 1)

      - name: No Figma tokens in repo
        run: |
          ! git grep -i "figd_" -- ':!ops/figma-snapshot.py' || \
            (echo "Figma token found in repo" && exit 1)

      - name: Token discipline (no raw literals)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint || echo "lint not configured yet — skipping"
          fi

      - name: Flow parity
        run: python ops/flow-parity.py || echo "flow.contract.json not signed yet — skipping"

      - name: Build
        run: |
          if [ -f package.json ]; then
            npm run build || echo "build not configured yet — skipping"
          fi

      - name: Visual audit capture
        run: python ops/visual-audit.py --ci || echo "visual-audit scaffold — no app to audit yet"

      - name: Perf budgets
        run: |
          if [ -f package.json ]; then
            npm run lighthouse:ci || echo "lighthouse not configured yet — skipping"
          fi
