# render.yaml
services:
  - type: web
    name: realtime-app
    runtime: node
    plan: starter          # NOT free: spin-down severs WebSocket connections
    region: oregon
    buildCommand: npm ci && npm run build --workspaces
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /healthz
    numInstances: 1        # >1 requires the Socket.io Redis adapter
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
    # No Figma credential here. Extraction happens at design time, not runtime.
