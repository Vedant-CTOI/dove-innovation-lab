# infra/render.yaml
services:
  - type: web
    name: minutemaid-workshop
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MODERATOR_KEY
        generateValue: true
    # No Figma credentials needed. This is a standalone workshop platform.
