# infra/render.yaml
services:
  - type: web
    name: minutemaid-workshop
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MODERATOR_KEY
        generateValue: true
    # Same-origin single-service: Express serves client/dist + SPA fallback + Socket.IO.
    # No CORS config needed. PORT is auto-injected by Render — do not set it here.
